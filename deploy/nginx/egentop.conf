# Egentop — validation-instance reverse proxy (TLS termination).
#
# This is the ONLY public entry point. nginx terminates TLS on 443, redirects
# plain HTTP to HTTPS, and proxies to the app on 127.0.0.1:8080 (bare binary
# under systemd, or the app container published to loopback only).
#
# Install (host nginx on the VPS):
#   sudo install -d /etc/nginx/sites-available
#   sudo install -m 0644 deploy/nginx/egentop.conf /etc/nginx/sites-available/egentop.conf
#   sudo ln -s ../sites-available/egentop.conf /etc/nginx/sites-enabled/egentop.conf
#   sudo nginx -t && sudo systemctl reload nginx
#
# TLS certificates (Let's Encrypt / certbot):
#   sudo certbot certonly --nginx -d api.example.com
#
# Replace `api.example.com` with the real hostname everywhere.

# Edge rate limiting for the auth surface. Keyed on the client IP as seen by
# nginx ($binary_remote_addr), NOT on X-Forwarded-For (attacker-controlled).
# This is the first line of defense; the app adds per-endpoint limits
# (login 5/min, register 3/min, refresh 10/min, password change 5/min), so
# the edge zone is deliberately looser than the per-endpoint limits.
limit_req_zone $binary_remote_addr zone=egentop_auth:10m rate=20r/m;

# Plain HTTP -> HTTPS. This must stay — the app sets Secure on the refresh
# cookie in production, so every request must arrive over TLS.
server {
    listen 80;
    listen [::]:80;
    server_name api.example.com;

    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name api.example.com;

    ssl_certificate     /etc/letsencrypt/live/api.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.example.com/privkey.pem;

    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;

    add_header Strict-Transport-Security "max-age=63072000" always;

    # Upper bound on request bodies. The app has no body-size limit of its
    # own (security review MEDIUM-3); nginx enforces one at the edge.
    client_max_body_size 1m;

    # Auth surface: edge rate limit + proxy. Prefix match covers
    # /v1/auth/refresh, /logout, /logout-all, /register, /login.
    location /v1/auth/ {
        limit_req zone=egentop_auth burst=10 nodelay;

        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host              $host;
        # SECURITY (HIGH-1 fix): overwrite, never append, X-Forwarded-For.
        # The app's rate limiter keys on this header VERBATIM. The old
        # `$proxy_add_x_forwarded_for` appends an attacker-supplied value, so
        # each forged value created a fresh rate-limit bucket (bypass) and an
        # unbounded in-memory map (memory DoS). $remote_addr is the IP nginx
        # actually saw on the TCP connection — it cannot be forged by a client.
        proxy_set_header X-Forwarded-For   $remote_addr;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Everything else.
    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host              $host;
        proxy_set_header X-Forwarded-For   $remote_addr;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# If you later front this VPS with Cloudflare, nginx will see Cloudflare's IP
# as $remote_addr. Key the auth zone on the CF-provided header instead:
#   limit_req_zone $http_cf_connecting_ip zone=egentop_auth:10m rate=20r/m;
# and keep overwriting X-Forwarded-For with the value you actually trust.
