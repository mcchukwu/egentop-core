services:
  db:
    image: postgres:16-alpine
    container_name: egentop-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-egentop}
      POSTGRES_USER: ${DB_USER:-user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-password}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - egentop_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-user} -d ${DB_NAME:-egentop}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  egentop_pgdata:
